<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirecionando…</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-EV50FKGMWF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-EV50FKGMWF');

  var PADRAO = 'https://www.linkedin.com/company/quintoandar-com-br';
  var params = new URLSearchParams(window.location.search);
  var fonte = params.get('utm_source') || '';
  if (fonte === 'qr') fonte = 'qr-linkedin'; // compatibilidade com QR antigos

  var destino = null;
  var gaOk = false;
  var redirecionado = false;

  function ir(url) {
    if (redirecionado) return;
    redirecionado = true;
    window.location.replace(url);
  }
  function tentar() {
    if (gaOk && destino) {
      var l = document.getElementById('manual');
      if (l) l.href = destino;
      ir(destino);
    }
  }

  gtag('event', 'qr_scan', {
    destino_id: fonte,
    event_callback: function () { gaOk = true; tentar(); },
    event_timeout: 1500
  });

  fetch('destinations.json?_=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var achou = (d.destinos || []).filter(function (x) { return x.id === fonte; })[0];
      destino = achou ? achou.url : PADRAO;
      tentar();
    })
    .catch(function () { destino = PADRAO; tentar(); });

  // fallback: redireciona mesmo se o GA ou a lista falharem
  setTimeout(function () { ir(destino || PADRAO); }, 1500);
</script>
<style>
  body { font-family: system-ui, sans-serif; display: flex; min-height: 100vh; margin: 0;
         align-items: center; justify-content: center; text-align: center; padding: 16px; }
</style>
</head>
<body>
  <p>Redirecionando…<br><a id="manual" href="https://www.linkedin.com/company/quintoandar-com-br">Clique aqui se não for redirecionado</a></p>
</body>
</html>
