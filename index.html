<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirecionando…</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-EV50FKGMWF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-EV50FKGMWF');

  var PADRAO = 'https://www.linkedin.com/company/quintoandar-com-br';
  var params = new URLSearchParams(window.location.search);
  var fonte = params.get('utm_source') || '';
  if (fonte === 'qr') fonte = 'qr-linkedin'; // compatibilidade com QR antigos

  var destino = null;      // só é preenchido quando a lista de destinos responde
  var gaOk = false;        // true quando o GA confirma o evento OU após 1,5 s
  var redirecionado = false;

  function ir(url) {
    if (redirecionado) return;
    redirecionado = true;
    window.location.replace(url);
  }
  function tentar() {
    if (destino) {
      var l = document.getElementById('manual');
      if (l) l.href = destino;      // o link manual só aponta para o destino real
    }
    if (gaOk && destino) ir(destino);
  }

  // 1) Evento no GA. O GA nunca segura o redirecionamento por mais de 1,5 s.
  gtag('event', 'qr_scan', {
    destino_id: fonte,
    event_callback: function () { gaOk = true; tentar(); },
    event_timeout: 1500
  });
  setTimeout(function () { gaOk = true; tentar(); }, 1500);

  // 2) Lista de destinos. Em rede lenta (celular) ela pode demorar: a página ESPERA por ela
  //    e tenta de novo se falhar, em vez de cair no destino reserva.
  function carregar(tentativa) {
    fetch('destinations.json?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        var campanha = params.get('utm_campaign') || '';
        var ev = (d.eventos || []).filter(function (x) { return x.origem === fonte && x.campanha === campanha; })[0];
        var achou = (d.destinos || []).filter(function (x) { return x.id === fonte; })[0];
        destino = ev ? ev.url : ((achou && achou.url) ? achou.url : PADRAO);
        tentar();
      })
      .catch(function () {
        if (tentativa < 3) setTimeout(function () { carregar(tentativa + 1); }, 700 * tentativa);
        else { destino = PADRAO; tentar(); }
      });
  }
  carregar(1);

  // 3) Último recurso: se nada respondeu em 12 s, vai para o destino reserva.
  setTimeout(function () { if (!destino) { destino = PADRAO; gaOk = true; tentar(); } }, 12000);
</script>
<style>
  body { font-family: system-ui, sans-serif; display: flex; min-height: 100vh; margin: 0;
         align-items: center; justify-content: center; text-align: center; padding: 16px; }
</style>
</head>
<body>
  <p>Redirecionando…<br><a id="manual">Clique aqui se não for redirecionado</a></p>
</body>
</html>
